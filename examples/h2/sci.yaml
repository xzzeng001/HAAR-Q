# Compact H2 HAAR-SCI example. See haar_q/conf/method/haar.yaml for the full Lanczos controls.
common:
  device: cpu
  dtype: float64
  random_seed: 2333
  max_relative_step: 2

model:
  name: fcidump
  params:
    model_path: ../hamiltonians/H2.FCIDUMP
    # FCI ground-state energy for these integrals including the constant term, in hartree.
    ref_energy: -1.4275251968493827

network:
  name: mlp/u1u1
  params:
    hidden: [16]

optimizer:
  name: Adam
  params:
    lr: 0.01

action:
  name: haar
  params:
    network_seed_count: 2
    previous_seed_count: 2
    krylov_extend_count: 2
    krylov_iteration: 1
    optimizer_steps: 10

hydra:
  run:
    dir: outputs/${action.name}/${now:%Y-%m-%d_%H-%M-%S-%f}
