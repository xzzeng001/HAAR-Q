# HAAR-Q calculation input. Launch with python -m haar_q -i input.yaml
# Edit the four choices below, or override any choice on the command line.
defaults:
  - method: vmc        # vmc, haar, excited, forces, guide, pretrain, pert, chop_imag, orbit, haar_with_orbit
  - system: fcidump    # fcidump, geometry (PySCF), hubbard, ising, openfermion, optimized_basis
  - ansatz: mlp        # mlp, transformers, mps (lattice models only)
  - optim: adam        # adam, lbfgs
  - _self_             # The settings in this file take precedence over the module defaults.

common:
  device: cpu
  dtype: float64
  max_relative_step: 2      # New outer cycles to run. Set null to use an absolute limit instead.
  max_absolute_step: null   # Stop at this total cycle number, including earlier checkpoint cycles.
  random_seed: 2333         # Set null on restart to restore the checkpoint RNG state.
  parent_path: null         # Checkpoint to resume or analyze. Required for pool post-processing in a fresh directory.
  checkpoint_interval: 5   # Save a numbered snapshot every N saves, in addition to data.pth.

files:                      # Relative data paths start at this YAML file.
  fcidump: examples/hamiltonians/H2.FCIDUMP
  ref_energy: -1.4275251968493827  # Hartree for this H2 input. Update or clear when changing the molecule.
  molecule: null            # OpenFermion MolecularData file for system=openfermion.
  optimized_basis: null     # Tensor file from an orbital calculation for system=optimized_basis.
  dataset: null             # Torch (packed configurations, amplitudes) pair for method=pretrain.
  orbital_output: outputs/H2-natural-orbitals.pt  # Destination of the orbit post-processing action.

geometry:                     # Used by system=geometry. PySCF computes the molecular-orbital integrals.
  atoms: |                    # Element and Cartesian x, y, z, one atom per line.
    H  0.0  0.0  0.0
    H  0.0  0.0  0.74
  xyz_file: null              # Optional single-frame XYZ file relative to this YAML. Overrides atoms when set.
  unit: Angstrom              # Angstrom or Bohr, also applied to an XYZ file.
  basis: sto-3g               # Orbital basis on all atoms.
  charge: 0                   # Total molecular charge.
  spin: 0                     # N_alpha - N_beta (2S): 0 for a singlet, 1 for a doublet.
  ref_energy: null            # Optional reference total energy in hartree. Null uses the converged HF energy.

symmetry: ${default_symmetry}      # Model default: u1u1 for electronic systems, 0 for Ising.
sampling_control:
  seed_count: 2                    # Starting samples for VMC, guide and SCI.
  target_basis_size: 4             # Total target for VMC/guide. SCI uses Krylov expansion controls.
  unique_seeds: ${supports_unique} # Automatic for the selected network. MPS uses sampling with replacement.
training:
  optimizer_steps: 10              # Wavefunction updates per cycle for VMC, guide and SCI.
  learning_rate: 0.01              # Shared initial step size of the selected optimizer.

states:                            # method=excited: lowest states on the selected determinant space.
  roots: 2                         # Total number of roots including ground state 0.
  residual_tolerance: 1.0e-8        # Maximum projected eigenpair residual in Hamiltonian energy units.
forces:                            # method=forces: fixed-space nuclear forces for a geometry SCI checkpoint.
  root: 0                          # Zero-based energy rank. Set common.parent_path to the matching checkpoint.

# Module-specific settings can coexist here. Only selected modules participate in the job.
options:
  method:
    vmc: {hamiltonian_guided: true}    # Expand the basis and minimize its projected energy without Lanczos.
    haar: {krylov_iteration: 1}        # Lanczos steps beyond the initial vector in the H2 example.
  ansatz:
    mlp: {hidden: [16]}                # Hidden layer widths.

hydra:
  searchpath: [pkg://haar_q.conf]     # Load the calculation modules shipped with HAAR-Q.
  run:
    dir: outputs/${action.name}/${now:%Y-%m-%d_%H-%M-%S-%f}
