[build-system]
requires = ["setuptools>=80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "haar-q"
dynamic = ["version"]
dependencies = [
  "platformdirs>=4.5.1",
  "numpy>=2.3.5",
  "scipy>=1.16.3",
  "torch>=2.9.1",
  "pybind11>=3.0.1",
  "ninja>=1.13.0",
  "hydra-core>=1.3.2",
  "openfermion>=1.7.1",
  "tensorboard>=2.20.0",
  "dacite>=1.9.2",
  "pyscf>=2.12.1",
]
requires-python = ">=3.12"
authors = [
  { name = "xiongzhi zeng", email = "xzzeng@ustc.edu.cn" },
  { name = "Hao Zhang", email = "hzhangxyz@outlook.com" },
]
maintainers = [{ name = "xiongzhi zeng", email = "xzzeng@ustc.edu.cn" }]
description = "HAAR-Q: Hamiltonian-guided neural quantum states, selected CI, and variational optimization"
readme = "README.md"
license = "GPL-3.0-or-later"
keywords = ["quantum", "manybody", "quantum-chemistry", "quantum-simulation", "molecular-simulation", "algorithms", "simulation", "wave-function", "ground-state", "ansatz", "torch", "pytorch"]
classifiers = [
  "Programming Language :: C++",
  "Programming Language :: Python :: 3",
  "Environment :: GPU :: NVIDIA CUDA",
  "Topic :: Scientific/Engineering :: Mathematics",
  "Topic :: Scientific/Engineering :: Physics",
  "Topic :: Scientific/Engineering :: Chemistry",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.19.1",
  "pytest>=9.0.2",
  "ruff>=0.14.10",
  "types-pyyaml>=6.0.12",
]
pyscf = [
    "pyscf>=2.12.1",
]

[project.urls]
Homepage = "https://github.com/xzzeng001/HAAR-Q"
Repository = "https://github.com/xzzeng001/HAAR-Q.git"
Issues = "https://github.com/xzzeng001/HAAR-Q/issues"
Publication = "https://doi.org/10.1021/acs.jctc.5c01415"
"Original source" = "https://github.com/USTC-KnowledgeComputingLab/qmp-kit"

[project.scripts]
haar-q = "haar_q.__main__:main"

[tool.setuptools.packages.find]
include = ["haar_q*"]

[tool.setuptools.data-files]
"share/haar-q" = ["input.yaml"]
"share/haar-q/examples/pcluster" = ["examples/pcluster/input.yaml"]
"share/haar-q/examples/h2" = ["examples/h2/H2.xyz"]
"share/haar-q/examples/hamiltonians" = ["examples/hamiltonians/H2.FCIDUMP"]

[tool.setuptools.package-data]
"haar_q.conf" = ["method/*.yaml", "system/*.yaml", "ansatz/*.yaml", "optim/*.yaml"]
haar_q = [
  "hamiltonian/_hamiltonian.cpp",
  "hamiltonian/_hamiltonian_cpu.cpp",
  "hamiltonian/_hamiltonian_cuda.cu",
]

[tool.setuptools.dynamic]
version = { attr = "haar_q.version.__version__" }

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.format]

[tool.mypy]
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
